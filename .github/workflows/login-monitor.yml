name: Mayson Login OTP Synthetic Monitoring

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Run Synthetic Login Monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Playwright Synthetic Test
        env:
          MAYSON_BASE_URL: ${{ secrets.MAYSON_BASE_URL }}
          MAYSON_USERNAME: ${{ secrets.MAYSON_USERNAME }}
          MAYSON_PASSWORD: ${{ secrets.MAYSON_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST || 'imap.gmail.com' }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || '993' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL || 'true' }}
          OTP_EMAIL_SENDER: ${{ secrets.OTP_EMAIL_SENDER }}
          OTP_EMAIL_SUBJECT: ${{ secrets.OTP_EMAIL_SUBJECT }}
        run: |
          pytest --html=report.html --self-contained-html


      - name: Upload Failure Artifacts (Screenshots & Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            screenshots/
            traces/
            report.html
          retention-days: 14
